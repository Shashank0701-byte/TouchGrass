<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f2eb" />
    <title>TouchGrass — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f2f2eb; color: #231f20; font: 16px/1.6 Arial, sans-serif; text-align: center; }
      main { max-width: 440px; }
      img { width: 64px; height: 64px; }
      h1 { margin: 24px 0 8px; font: 400 42px/1.05 Georgia, serif; letter-spacing: -.04em; }
      p { color: #66665e; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 3px; background: #2e4742; color: #f2f2eb; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You’re out of signal.</h1>
      <p>TouchGrass needs one online visit to get ready. Come back when you have a connection, and your saved quests will be here when you need them.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
